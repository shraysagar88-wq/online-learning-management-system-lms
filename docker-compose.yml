services:
  postgres:
    image: postgres:16
    container_name: gu-lms-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gu_lms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - gu_lms_postgres_data:/var/lib/postgresql/data

volumes:
  gu_lms_postgres_data:
